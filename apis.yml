aid: actionpower
name: Actionpower
description: >-
  ActionPower Corp. (주식회사 액션파워) is a Seoul-based deep-tech AI company founded in 2016 that builds its own
  end-to-end speech recognition, speaker diarization, speech synthesis and small-language-model stack, and sells it
  two ways: as daglo, a voice-intelligence workspace that records, transcribes, summarizes and translates meetings,
  calls and lectures for more than two million users; and as the daglo Cloud API, a developer platform at
  apis.daglo.ai offering synchronous and asynchronous speech-to-text, bidirectional-streaming realtime STT over gRPC,
  chat completion, dialogue summarization, meeting minutes, paragraph splitting and text-to-speech. The company is
  ISO 27001 certified, ships an on-premise closed-network deployment for public sector, finance, healthcare and
  broadcast customers, and reports customers including LG Electronics, KT Skylife, NH Nonghyup Bank and the Daegu
  Metropolitan Government.
