apis:
- name: daglo Realtime Streaming STT (gRPC)
  description: >-
    Bidirectional gRPC streaming speech recognition served from apis.daglo.ai. The provider publishes
    the proto3 service definition (package dagloapis.speech.v1, rpc StreamingRecognize) in its developer
    guide; clients stream LINEAR16 16kHz mono audio and receive interim and final transcripts. Language
    codes ko-KR, en-US and mixed are supported, a single request stream may run up to six hours, and access
    requires an additional permission granted by api-support@daglo.ai.
  humanURL: https://developers.daglo.ai/guide/Quick-Realtime-Voice-To-Text.html
  baseURL: https://apis.daglo.ai
  image: https://daglo.ai/d/og-image
  tags:
