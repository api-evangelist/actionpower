apis:
  - name: daglo Cloud API
    description: >-
      REST API for ActionPower's speech and language stack, served at https://apis.daglo.ai and authenticated with a
      bearer API token issued from the daglo Developers console. The published production contract covers synchronous
      and asynchronous speech-to-text (with speaker diarization, keyword boosting, multi-channel audio, sentiment
      analysis and subtitle-file export), dialogue summarization, asynchronous meeting minutes, paragraph splitting
      and text-to-speech. Long-running jobs return a request id (rid) that is either polled with GET or delivered to a
      caller-supplied callback URL.
    humanURL: https://developers.daglo.ai/guide/en/
    baseURL: https://apis.daglo.ai
    image: https://daglo.ai/d/og-image
    tags:
      - Speech Recognition
      - Speech To Text
      - Text To Speech
      - Natural Language Processing
      - Transcription
    properties:
