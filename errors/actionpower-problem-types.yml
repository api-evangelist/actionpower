job_states:
  note: >-
    Asynchronous failures do NOT surface as HTTP errors. A 200 on the polling GET carries a `status`
    field, and two of its values are terminal failures an agent must handle explicitly.
  states:
    - {status: ai_requested, terminal: false, meaning: request accepted}
    - {status: uploaded, terminal: false, meaning: file upload complete}
    - {status: file_processing, terminal: false, meaning: pre-processing the file}
    - {status: transcribing, terminal: false, meaning: transcription in progress}
    - {status: post_processing, terminal: false, meaning: post-processing}
    - {status: transcribed, terminal: true, meaning: success}
    - {status: transcript_error, terminal: true, meaning: transcription failed — wait and re-submit}
    - {status: file_error, terminal: true, meaning: the file itself is bad — fix the file and re-submit}
