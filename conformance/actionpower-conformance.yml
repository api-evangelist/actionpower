domain_standard:
  assessed: true
  found: false
  note: >-
    Speech recognition and speech synthesis have no interchange standard the contract could declare —
    there is no SCIM/OData/HL7/OpenRTB analogue for an STT payload, and the nearest thing to a shared
    shape in this market is Google Cloud Speech's de-facto request/response vocabulary. ActionPower's
    proto is visibly modelled on it (StreamingRecognize, RecognitionConfig, interim_results, is_final,
    StreamingRecognitionResult), which is a real portability benefit for a caller migrating from Google
    STT, but a vendor's API shape is not a standard and is not recorded as a conformance. Reward-only
    dimension, so nothing is invented to fill it.
