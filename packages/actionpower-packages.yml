source: >-
  npm registry search + registry.npmjs.org metadata, PyPI, and the ActionPower GitHub organization
  (https://github.com/actionpower). No PyPI, RubyGems, Maven, NuGet, crates.io or Go module publishes
  a daglo client.
note: >-
  ActionPower publishes exactly one first-party daglo API client — a browser JavaScript SDK for the
  realtime streaming STT surface — and it is distributed as GitHub source only, with no npm package and
  no tagged release. Its last commit is 2025-03-23, which predates the current production contract, and
  it is still named "-beta". The two @actionpower npm packages that DO exist are internal engineering
  tooling (an i18n spreadsheet converter and a React UI kit), not API clients; they are recorded here
  with api_client: false so they are not mistaken for SDKs. Every other language the API supports has
  no first-party client at all — the docs teach raw curl for REST and raw grpcio for streaming.
