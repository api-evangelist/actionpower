openapi: 3.0.0
info:
  title: Cloud API 문서
  version: '1.0'
  description: |-
    API를 서비스를 사용하기 위해서는 JWT 토큰이 필요합니다.

    ## API Rate Limits

    <blockquote>

    각 API Endpoint 별 20 requests/sec 의 Rate Limit이 적용됩니다.

    이 허용치를 초과하는 요청량에 대해서는 HTTP 429 Too Many Request Error 응답이 나갈 수 있으며,

    반복, 지속적으로 요청량을 초과하게 되는 경우, 비정상적인 이용으로 간주되어 요청이 차단될 수 있습니다.

    </blockquote>
  contact:
    name: Customer Service
    email: cs@daglo.ai
  termsOfService: 'https://daglo.ai/terms'
  license:
    url: 'https://daglo.ai/license'
    name: License
servers:
  - url: https://apis.daglo.ai
    description: daglo Cloud API production host (documented base URL)
paths:
  /stt/v1/sync/transcripts:
    x-permission: stt-sync
    post:
      x-descriptors:
        - default: general
          at: /sttConfig/model
      x-features:
        - at: /sttConfig/model
          default: general
      x-return-usage:
        - name: audioDuration
          at: /returnAudioDuration
          regex: 'true'
      summary: Transcribe short audio
      description: 짧은 오디오를 텍스트로 변환합니다. 동기화 방식이 사용됩니다.
      tags:
        - STT
        - Sync
      operationId: post-stt-v1-sync-transcripts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              x-tags:
                - STT
              properties:
                file:
                  type: string
                  format: binary
                  description: |-
                    받아쓰기를 요청할 파일입니다.

                    파일의 재생 시간이 30초를 초과할 수 없습니다.
                sttConfig:
                  type: object
                  description: 동기 방식의 STT 요청에 대한 설정입니다.
                  properties:
                    model:
                      type: string
                      enum:
                        - general
                      description: |-
                        받아쓰기에 사용할 모델 이름입니다.

                        명시하지 않을 경우 general 이 사용됩니다.

                        사용 가능한 모델은 다음과 같습니다.

                        |**모델**|**설명**|
                        |:---:|:---:|
                        |`general`|일반적인 경우에 사용되는 모델입니다.|
                    keywordBoost:
                      type: object
                      description: |-
                        키워드 부스트를 위한 설정입니다.

                        키워드 부스트를 활성화 하면 받아쓰기 결과에서 명시된 키워드들의 인식 확률이 향상됩니다.
                      properties:
                        enable:
                          type: boolean
                          description: 키워드 부스트를 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                        keywords:
                          type: array
                          description: |-
                            강조할 키워드를 명시합니다. string의 배열 형태입니다.

                            명시하지 않을 경우 키워드 부스트가 비활성화 됩니다.
                          items:
                            type: string
                          example:
                            - 다글로
                        boost:
                          type: integer
                          description: |-
                            키워드 부스트 정도를 설정합니다. 높을 수록 더 높은 확률로 키워드를 인식합니다.

                            1 ~ 15 사이의 정수값입니다. 명시하지 않으면 5 입니다.
                          minimum: 1
                          maximum: 15
                          default: 7
                      x-tags:
                        - STT
                  x-tags:
                    - STT
                custom:
                  type: object
                  description: |-
                    응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                    사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

                    요청을 자동화 하여 보낼 때 유용합니다.
                  example:
                    app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                  x-tags:
                    - Common
              required:
                - file
          application/json:
            schema:
              allOf:
                - type: object
                  x-tags:
                    - STT
                  properties:
                    file:
                      type: string
                      format: binary
                      description: |-
                        받아쓰기를 요청할 파일입니다.

                        파일의 재생 시간이 30초를 초과할 수 없습니다.
                    sttConfig:
                      type: object
                      description: 동기 방식의 STT 요청에 대한 설정입니다.
                      properties:
                        model:
                          type: string
                          enum:
                            - general
                          description: |-
                            받아쓰기에 사용할 모델 이름입니다.

                            명시하지 않을 경우 general 이 사용됩니다.

                            사용 가능한 모델은 다음과 같습니다.

                            |**모델**|**설명**|
                            |:---:|:---:|
                            |`general`|일반적인 경우에 사용되는 모델입니다.|
                        keywordBoost:
                          type: object
                          description: |-
                            키워드 부스트를 위한 설정입니다.

                            키워드 부스트를 활성화 하면 받아쓰기 결과에서 명시된 키워드들의 인식 확률이 향상됩니다.
                          properties:
                            enable:
                              type: boolean
                              description: 키워드 부스트를 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                            keywords:
                              type: array
                              description: |-
                                강조할 키워드를 명시합니다. string의 배열 형태입니다.

                                명시하지 않을 경우 키워드 부스트가 비활성화 됩니다.
                              items:
                                type: string
                              example:
                                - 다글로
                            boost:
                              type: integer
                              description: |-
                                키워드 부스트 정도를 설정합니다. 높을 수록 더 높은 확률로 키워드를 인식합니다.

                                1 ~ 15 사이의 정수값입니다. 명시하지 않으면 5 입니다.
                              minimum: 1
                              maximum: 15
                              default: 7
                          x-tags:
                            - STT
                      x-tags:
                        - STT
                    custom:
                      type: object
                      description: |-
                        응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                        사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

                        요청을 자동화 하여 보낼 때 유용합니다.
                      example:
                        app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                      x-tags:
                        - Common
                  required:
                    - file
                - type: object
                  properties:
                    fileName:
                      type: string
                      description: 파일 이름입니다.
                      x-tags:
                        - Common
              x-tags:
                - STT
      responses:
        '200':
          description: Example response
          content:
            application/json:
              schema:
                type: object
                properties:
                  sttResult:
                    type: object
                    properties:
                      transcript:
                        type: string
                        description: 받아쓰기 결과 전체 Text.
                  audioDuration:
                    type: number
                    format: float
                    description: 초.
                  elapsedTime:
                    type: integer
                    description: 밀리초.
                  custom:
                    type: object
                    description: |-
                      응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.

                      사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.

                      요청을 자동화 하여 보낼 때 유용합니다.
                    example:
                      app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                    x-tags:
                      - Common
                x-tags:
                  - STT
        '204':
          description: No Content. 요청은 성공하였으나 반환한 결과가 없습니다. 받아쓰기의 경우 받아쓰기는 완료되었으나 결과가 비어있습니다.
        '400':
          description: Bad Request. 요청 형식이 잘못 되었습니다.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '403':
          description: Forbidden. 허용되지 않은 접근입니다.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '413':
          description: Payload Too Large. 요청이 너무 큽니다.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '415':
          description: Unsupported Media Type.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '429':
          description: Too Many Requests.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '500':
          description: Internal Server Error. 서버 오류입니다.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
        '503':
          description: Service Unavailable.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
                  error:
                    type: string
                x-tags:
                  - Common
  /stt/v1/async/transcripts:
    x-permission: stt-async
    post:
      x-descriptors:
        - default: ko-KR
          at: /sttConfig/language
      x-features:
        - at: /sttConfig/language
          default: ko-KR
        - name: sentimentAnalysis
          at: /nlpConfig/sentimentAnalysis/enable
          regex: 'true'
      x-wait-for-response: false
      summary: Send long audio to transcribe
      description: |-
        오디오 파일을 텍스트로 변환합니다. 비동기화 방식이 사용됩니다. POST 요청으로 rid를 발급받은 후 GET 요청으로 진행상황 및 결과를 확인할 수 있습니다.

        `multipart/form-data` 방식의 요청으로 파일을 직접 보낼 수 있고, `application/json` 방식의 요청으로 파일이 저장된 공개 URL을 넘길 수 있습니다.
      tags:
        - STT
        - Async
      operationId: post-stt-v1-async-transcripts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |-
                    받아쓰기를 요청할 파일입니다.

                    파일 크기가 2GB를 넘지 않아야 하고, 파일 재생 시간이 4시간 이내여야 합니다.

                    다음과 같은 형식의 파일을 업로드하여 받아쓰기 하실 수 있습니다.

                    • 오디오 : `.3gp`, `.3gpp`, `.ac3`, `.aac`, `.aiff`, `.amr`, `.au`, `.flac`,
                              `.m4a`, `.mp3`, `.mxf`, `.opus`,
                              `.ra`, `.wav`, `.weba`

                    • 비디오 : `.asx`, `.avi`, `.ogm`, `.ogv`, `.m4v`, `.mov`, `.mp4`, `.mpeg`,
                              `.mpg`, `.wmv`

                    확장자(형식)가 같더라도 실제 내용(인코딩)이 다를 경우 받아쓰기가 진행되지 않을 수 있습니다.
                sttConfig:
                  type: object
                  description: 비동기 방식의 STT 요청을 위한 설정입니다.
                  properties:
                    model:
                      type: string
                      enum:
                        - general
                      description: |-
                        받아쓰기에 사용할 모델 이름입니다.

                        명시하지 않을 경우 `general` 이 사용됩니다.

                        사용 가능한 모델은 다음과 같습니다.

                        |**모델**|**설명**|
                        |:---:|:---:|
                        |`general`|일반적인 경우에 사용되는 모델입니다.|
                    language:
                      type: string
                      enum:
                        - ko-KR
                        - en-US
                        - mixed
                        - ja-JP
                        - cmn-Hans-CN
                        - de-DE
                        - fr-FR
                        - es-ES
                        - it-IT
                        - nl-NL
                        - sv-SE
                        - hi-IN
                        - ru-RU
                        - vi-VN
                        - th-TH
                        - id-ID
                        - fa-IR
                        - cs-CZ
                      description: |-
                        받아쓰기 할 컨텐츠의 언어입니다.

                        사용 가능한 값은 `ko-KR`, `en-US`, `mixed`, `ja-JP` 이며, 기본값은 `ko-KR` 입니다.

                        (대소문자를 구분합니다)

                        한국어와 영어가 섞여있는 컨텐츠의 경우, `mixed`를 사용하면 받아쓰기를 할 때 두 언어를 구분하여 받아쓰기를 시도합니다.
                    keywordBoost:
                      type: object
                      description: |-
                        키워드 부스트를 위한 설정입니다.

                        키워드 부스트를 활성화 하면 받아쓰기 결과에서 명시된 키워드들의 인식 확률이 향상됩니다.
                      properties:
                        enable:
                          type: boolean
                          description: 키워드 부스트를 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                        keywords:
                          type: array
                          description: |-
                            강조할 키워드를 명시합니다. string의 배열 형태입니다.

                            명시하지 않을 경우 키워드 부스트가 비활성화 됩니다.
                          items:
                            type: string
                          example:
                            - 다글로
                        boost:
                          type: integer
                          description: |-
                            키워드 부스트 정도를 설정합니다. 높을 수록 더 높은 확률로 키워드를 인식합니다.

                            1 ~ 15 사이의 정수값입니다. 명시하지 않으면 5 입니다.
                          minimum: 1
                          maximum: 15
                          default: 7
                      x-tags:
                        - STT
                    multiChannel:
                      type: object
                      description: |-
                        멀티 채널 오디오에 대한 설정입니다.

                        오디오의 채널이 여러개인 경우 각 채널의 음성을 따로 받아쓰기 합니다.
                        2 개의 채널까지만 지원합니다.

                        명시되지 않을 경우 비활성화 됩니다.
                      properties:
                        channelCount:
                          type: integer
                          description: |-
                            오디오의 채널 수 입니다.

                            1 보다 큰 값이 명시 되면 각 채널의 음성을 각각 받아쓰기 합니다.
                          minimum: 1
                          maximum: 2
                      x-tags:
                        - STT
                    speakerDiarization:
                      type: object
                      description: |-
                        화자 분리를 위한 설정입니다.

                        오디오에 나타나는 화자들을 구분하여 받아쓰기를 합니다. 명시하지 않을 경우 비활성화 됩니다.
                      properties:
                        enable:
                          type: boolean
                          description: 화자 분리를 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                        speakerCountHint:
                          type: integer
                          description: 화자가 몇 명인지에 대한 힌트를 설정합니다. 화자 분리 성능이 개선될 수 있습니다.
                          minimum: 2
                      x-tags:
                        - STT
                  x-tags:
                    - STT
                nlpConfig:
                  type: object
                  description: 자연어 처리 설정을 위한 객체 입니다.
                  properties:
                    keywordExtraction:
                      type: object
                      description: |-
                        키워드 추출 설정을 위한 객체입니다.

                        이 설정을 사용하면 텍스트에서 키워드를 추룰합니다.
                      x-tags:
                        - NLP
                      properties:
                        enable:
                          type: boolean
                          description: 키워드 추출을 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                        maxCount:
                          type: integer
                          description: |-
                            추출 할 키워드의 최대 개수 입니다. 

                            값이 클 경우 속도에 영향을 줄 수 있습니다.

                            키워드가 많지 않을 경우 명시된 수 보다 적은 수의 키워드를 추출 할 수 있습니다.
                          minimum: 1
                          example: 10
                    sentimentAnalysis:
                      type: object
                      description: |-
                        텍스트 감정분석 설정을 위한 객체입니다.

                        이 설정을 사용하면 텍스트를 분석하여 전반적인 감정을 반환합니다.
                      properties:
                        enable:
                          type: boolean
                          description: 텍스트 감정 분석을 활성화 하기 위해서는 반드시 `true`로 설정해야 합니다.
                      x-tags:
                        - NLP
                  x-tags:
                    - NLP
                callback:
                  type: object
                  description: '비동기 요청의 진행 상태 및 결과를 콜백으로 전달 받고 싶을 때 사용합니다. '
                  properties:
                    url:
                      type: string
                      description: |-
                        콜백을 전송받을 http(s) 를 포함한 URL 입니다.

                        처리 중에는 진행상태를, 처리가 완료 된 뒤에는 결과 혹은 오류 상태를 `POST` 방식으로 해당 URL에 전송합니다.
                    headers:
                      type: object
                      description: '콜백 URL로 전송할 때, 헤더에 포함시켜야 하는 값이 있다면 명시해줍니다.'
                  x-tags:
                    - Common
                callbackUrl:
                  type: string
