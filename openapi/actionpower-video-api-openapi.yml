                      `file_processing`: 파일을 전처리 중 입니다.


                      `processing`: 요청 처리중 입니다.


                      `processed`: 요청이 처리 완료되었습니다.


                      `input_error`: 사용자 요청 값에 오류가 있습니다. 확인 후 다시 요청해 주세요.


