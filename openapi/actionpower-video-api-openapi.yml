        '503':
          description: 너무 많은 요청을 처리하고 있어 일시적으로 응답이 불가능한 상태입니다. 잠시 후 다시 시도해주세요.
  /video/v1/async/annotate/scenes/{rid}:
    x-permission: video-async-annotate-scene
