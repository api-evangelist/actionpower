                    - uploaded
                    - file_processing
                    - processing
                    - processed
                    - input_error
                    - file_error
                    - processing_error
                    example: processed
                    x-tags:
                    - Video
                  progress:
                    type: integer
                    description: 비디오 프로세싱 진행률 입니다.
                    minimum: 0
                    maximum: 100
                    example: 100
                  scenes:
                    type: array
                    items:
                      type: object
                      description: 비디오의 장면에 대한 설명입니다.
                      properties:
                        texts:
                          type: array
                          description: 한 장면을 설명할 수 있는 키워드들이 반환됩니다.
                          items:
                            type: string
                        segment:
                          type: object
                          description: 비디오의 구간에 대한 정보를 나타냅니다.
                          properties:
                            startTime:
                              type: number
                              format: float
                              description: 구간이 시작하는 시간입니다. 비디오의 시작을 기준으로 초 단위 시간입니다.
                            endTime:
                              type: number
                              format: float
                              description: 구간이 끝나는 시간입니다. 비디오의 시작을 기준으로 초 단위 시간입니다.
                  message:
                    type: string
                    description: 오류 메시지 등의 추가정보를 표시합니다.
                  custom:
                    type: object
                    description: '응답에 포함하여 받고 싶은 사용자 객체를 명시합니다.


                      사용자가 요청에 custom 객체를 명시한 경우 동일한 값이 응답에 명시되어 반환됩니다.


                      요청을 자동화 하여 보낼 때 유용합니다.'
                    example:
                      app_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
                    x-tags:
                    - Common
                x-tags:
                - Video
        '400':
          description: Bad Request. 요청 형식이 잘못 되었습니다.
          content:
            application/json:
              schema:
                type: object
                description: 에러 발생 시 응답입니다.
                properties:
